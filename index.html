<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
  <title>Wiki Standards</title>
  <meta name="description" content="Biblioteca normativa em Markdown, publicada com Docsify para navegação por família.">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>

<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Wiki Standards',
      repo: 'lucasbrisolla/wikistandards',
      auto2top: true,
      loadSidebar: true,
      maxLevel: 0,
      subMaxLevel: 3,
      search: {
        placeholder: 'Buscar norma',
        noData: 'Nenhum resultado encontrado.',
        depth: 2,
      }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
</body>
</html>
