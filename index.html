<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Wiki Standards</title>
  <meta name="description" content="Biblioteca de normas contábeis organizada para consulta, navegação por família e relações entre pronunciamentos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/wiki-standards-symbol.svg">
  <link id="docsify-theme" rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --base-font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono-font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      --appearance-bg: #ffffff;
      --appearance-border: #d9e2dd;
      --appearance-ink: #24312b;
      --appearance-muted: #5b6b63;
      --appearance-hover: #eef7f1;
    }

    body,
    input,
    button,
    textarea,
    .sidebar,
    .markdown-section {
      font-family: var(--base-font-family);
    }

    code,
    pre,
    kbd {
      font-family: var(--mono-font-family);
    }

    .markdown-section {
      font-size: 16.5px;
      line-height: 1.65;
    }

    .markdown-section table {
      font-size: 15px;
      line-height: 1.5;
    }

    .sidebar {
      font-size: 15px;
    }

    .sidebar-nav {
      padding: 0 18px 28px;
    }

    .sidebar-nav>ul,
    .sidebar-nav>p {
      margin-left: 0;
      padding-left: 0;
    }

    .sidebar-nav ul {
      list-style: none;
      padding-left: 0;
    }

    .sidebar-nav li {
      margin: 7px 0;
    }

    .sidebar-nav .app-sub-sidebar {
      margin: 8px 0 14px;
      padding-left: 14px;
      border-left: 1px solid rgba(91, 107, 99, 0.16);
    }

    .sidebar-nav .app-sub-sidebar li {
      margin: 8px 0;
      padding-left: 0;
    }

    .sidebar-nav .app-sub-sidebar a {
      color: #506158;
      font-size: 14px;
    }

    .sidebar-nav>ul>li.active>a {
      position: relative;
      padding-left: 14px;
    }

    .sidebar-nav>ul>li.active>a::before {
      content: '⌄';
      position: absolute;
      left: 0;
      top: 2px;
      color: #d85842;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
    }

    .sidebar-nav .app-sub-sidebar li.active>a {
      padding-left: 0;
    }

    .sidebar-nav .app-sub-sidebar li.active>a::before {
      content: none;
    }

    .sidebar-nav a {
      display: inline-block;
      padding: 3px 0;
      line-height: 1.45;
    }

    .sidebar-nav strong {
      display: block;
      margin: 22px 0 10px;
      color: #24312b;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .sidebar>h1 {
      margin: 20px 12px 22px;
    }

    .sidebar>h1 .app-name-link {
      display: flex;
      justify-content: center;
    }

    .sidebar>h1 img {
      width: min(248px, 88%);
      height: auto;
    }

    .home-hero {
      margin: 18px auto 44px;
      text-align: center;
    }

    .home-logo {
      width: min(460px, 90%);
      height: auto;
      margin: 0 auto 18px;
    }

    .home-logo-dark {
      display: none;
    }

    .home-hero p {
      max-width: 680px;
      margin: 0 auto;
      color: #5b6b63;
      font-size: 17px;
      line-height: 1.6;
    }

    .home-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: 0 auto 44px;
      max-width: 1020px;
    }

    .home-card {
      display: flex;
      min-height: 150px;
      flex-direction: column;
      gap: 8px;
      border: 1px solid #dce6e0;
      border-radius: 18px;
      padding: 22px;
      background: linear-gradient(145deg, #ffffff 0%, #f4faf6 100%);
      box-shadow: 0 14px 34px rgba(36, 49, 43, 0.08);
      color: #24312b;
      text-decoration: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .home-card:hover,
    .home-card:focus-visible {
      border-color: #ff9a85;
      box-shadow: 0 18px 42px rgba(36, 49, 43, 0.14);
      color: #24312b;
      outline: none;
      text-decoration: none;
      transform: translateY(-2px);
    }

    .home-card strong {
      font-size: 21px;
      line-height: 1.2;
    }

    .home-card span:last-child {
      color: #5b6b63;
      line-height: 1.55;
    }

    .appearance-switcher {
      position: fixed;
      top: 12px;
      left: 316px;
      z-index: 1000;
    }

    .appearance-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--appearance-border);
      border-radius: 999px;
      background: var(--appearance-bg);
      color: var(--appearance-ink);
      box-shadow: 0 8px 24px rgba(23, 36, 29, 0.12);
      cursor: pointer;
      line-height: 1;
    }

    .appearance-toggle svg {
      width: 21px;
      height: 21px;
      stroke-width: 2;
    }

    .appearance-toggle:hover,
    .appearance-toggle:focus-visible {
      background: var(--appearance-hover);
      outline: none;
    }

    .appearance-menu {
      position: absolute;
      top: 48px;
      left: 0;
      min-width: 150px;
      padding: 6px;
      border: 1px solid var(--appearance-border);
      border-radius: 8px;
      background: var(--appearance-bg);
      box-shadow: 0 14px 34px rgba(23, 36, 29, 0.16);
    }

    .appearance-menu[hidden] {
      display: none;
    }

    .catalog-search {
      position: relative;
      padding: 16px 16px 6px;
      border-bottom: 1px solid #e3ebe6;
    }

    .catalog-search-input {
      width: 100%;
      border: 1px solid #d5dfda;
      border-radius: 12px;
      padding: 12px 14px;
      background: #ffffff;
      color: #24312b;
      font-size: 15px;
      line-height: 1.2;
    }

    .catalog-search-input::placeholder {
      color: #708177;
    }

    .catalog-search-input:focus-visible {
      border-color: #ff9a85;
      outline: 2px solid rgba(255, 115, 92, 0.16);
      outline-offset: 1px;
    }

    .catalog-search-results {
      position: absolute;
      top: calc(100% - 4px);
      left: 16px;
      right: 16px;
      z-index: 50;
      border: 1px solid #d5dfda;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 18px 40px rgba(36, 49, 43, 0.12);
      overflow: hidden;
    }

    .catalog-search-results[hidden] {
      display: none;
    }

    .catalog-search-item {
      display: block;
      width: 100%;
      border: 0;
      border-top: 1px solid #edf3ef;
      padding: 12px 14px;
      background: transparent;
      color: #24312b;
      cursor: pointer;
      text-align: left;
    }

    .catalog-search-item:first-child {
      border-top: 0;
    }

    .catalog-search-item:hover,
    .catalog-search-item:focus-visible,
    .catalog-search-item.is-active {
      background: #f6fbf8;
      outline: none;
    }

    .catalog-search-code {
      display: block;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }

    .catalog-search-title {
      display: block;
      margin-top: 3px;
      color: #506158;
      font-size: 13px;
      line-height: 1.4;
    }

    .catalog-search-meta {
      display: block;
      margin-top: 6px;
      color: #7a8a81;
      font-size: 12px;
      line-height: 1.35;
    }

    .catalog-search-empty {
      padding: 12px 14px;
      color: #5b6b63;
      font-size: 13px;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      .appearance-switcher {
        left: 16px;
      }

      .home-cards {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 1120px) {
      .home-cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .appearance-option {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 8px 10px;
      background: transparent;
      color: var(--appearance-muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
    }

    .appearance-option:hover,
    .appearance-option:focus-visible,
    .appearance-option[aria-checked="true"] {
      background: var(--appearance-hover);
      color: var(--appearance-ink);
      outline: none;
    }

    body[data-theme-mode="dark"] {
      --appearance-bg: #1f2a25;
      --appearance-border: #3c4a43;
      --appearance-ink: #f2f7f4;
      --appearance-muted: #c0cbc5;
      --appearance-hover: #2c3a33;
    }

    body[data-theme-mode="dark"] .sidebar-nav strong {
      color: #edf2ef;
    }

    body[data-theme-mode="dark"] .sidebar-nav .app-sub-sidebar {
      border-left-color: rgba(192, 203, 197, 0.18);
    }

    body[data-theme-mode="dark"] .sidebar-nav .app-sub-sidebar a {
      color: #c0cbc5;
    }

    body[data-theme-mode="dark"] .sidebar-nav>ul>li.active>a::before {
      color: #ffb199;
    }

    body[data-theme-mode="dark"] .catalog-search {
      border-bottom-color: #33413b;
    }

    body[data-theme-mode="dark"] .catalog-search-input {
      border-color: #42534b;
      background: #18211d;
      color: #edf2ef;
    }

    body[data-theme-mode="dark"] .catalog-search-input::placeholder {
      color: #8da099;
    }

    body[data-theme-mode="dark"] .catalog-search-results {
      border-color: #42534b;
      background: #1b2520;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }

    body[data-theme-mode="dark"] .catalog-search-item {
      border-top-color: #29342f;
      color: #edf2ef;
    }

    body[data-theme-mode="dark"] .catalog-search-item:hover,
    body[data-theme-mode="dark"] .catalog-search-item:focus-visible,
    body[data-theme-mode="dark"] .catalog-search-item.is-active {
      background: #24302a;
    }

    body[data-theme-mode="dark"] .catalog-search-title {
      color: #c7d2cc;
    }

    body[data-theme-mode="dark"] .catalog-search-meta,
    body[data-theme-mode="dark"] .catalog-search-empty {
      color: #92a49c;
    }

    body[data-theme-mode="dark"] .home-hero p {
      color: #c0cbc5;
    }

    body[data-theme-mode="dark"] .home-logo-light {
      display: none;
    }

    body[data-theme-mode="dark"] .home-logo-dark {
      display: block;
    }

    body[data-theme-mode="dark"] .home-card {
      border-color: #4b5d55;
      background: linear-gradient(145deg, #24302b 0%, #1d2722 100%);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24);
      color: #f7faf8;
    }

    body[data-theme-mode="dark"] .home-card:hover,
    body[data-theme-mode="dark"] .home-card:focus-visible {
      border-color: #ff9a85;
      box-shadow: 0 20px 42px rgba(0, 0, 0, 0.28);
      background: linear-gradient(145deg, #2a3731 0%, #202a25 100%);
      color: #f7faf8;
    }

    body[data-theme-mode="dark"] .home-card span:last-child {
      color: #d3ddd7;
    }

    body[data-theme-mode="dark"] .markdown-section table {
      border-color: #68746f;
    }

    body[data-theme-mode="dark"] .markdown-section tr {
      background-color: #3a3d3b;
      border-color: #68746f;
    }

    body[data-theme-mode="dark"] .markdown-section tr:nth-child(2n) {
      background-color: #2f3331;
    }

    body[data-theme-mode="dark"] .markdown-section th,
    body[data-theme-mode="dark"] .markdown-section td {
      border-color: #68746f;
      color: #edf2ef;
    }

    body[data-theme-mode="dark"] .markdown-section th {
      background-color: #262b28;
      color: #ffffff;
      font-weight: 600;
    }

    body[data-theme-mode="dark"] .markdown-section td code {
      color: #f4f7f5;
    }

    body[data-theme-mode="dark"] .markdown-section td a {
      color: #ffb199;
      font-weight: 600;
    }

    body[data-theme-mode="dark"] .markdown-section td a:hover {
      color: #ffd0c2;
    }
  </style>
</head>

<body>
  <div class="appearance-switcher">
    <button class="appearance-toggle" id="appearance-toggle" type="button" aria-label="Mudar aparência"
      aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <path d="m14.5 5.5 4 4" />
        <path d="M3 21c3.2-.2 5.4-1.2 6.8-3 1.2-1.5 1.2-3.1 2.5-4.4l6.4-6.4a2.8 2.8 0 0 0-4-4l-6.4 6.4c-1.3 1.3-2.9 1.3-4.4 2.5C2.2 13.5 1.2 15.8 1 19" />
        <path d="M8 14l2 2" />
      </svg>
    </button>
    <div class="appearance-menu" id="appearance-menu" role="menu" hidden>
      <button class="appearance-option" type="button" role="menuitemradio" data-theme-choice="auto">Automático</button>
      <button class="appearance-option" type="button" role="menuitemradio" data-theme-choice="light">Claro</button>
      <button class="appearance-option" type="button" role="menuitemradio" data-theme-choice="dark">Escuro</button>
    </div>
  </div>

  <div id="app"></div>

  <script>
    const originalFetch = window.fetch.bind(window);
    const cacheBuster = '20260520';

    // Docsify busca os arquivos dinamicamente; forcar no-store e versionamento
    // evita que README, sidebar e mapas fiquem presos em cache antigo.
    window.fetch = function(resource, config = {}) {
      let nextResource = resource;

      if (typeof nextResource === 'string' && !/^https?:\/\//i.test(nextResource) && /\.(md|json)$/i.test(nextResource)) {
        const separator = nextResource.includes('?') ? '&' : '?';
        nextResource = `${nextResource}${separator}v=${cacheBuster}`;
      }

      return originalFetch(nextResource, {
        ...config,
        cache: 'no-store',
      });
    };

    window.$docsify = {
      name: 'Wiki Standards',
      logo: 'assets/wiki-standards-horizontal.svg',
      repo: 'lucasbrisolla/wikistandards',
      auto2top: true,
      loadSidebar: true,
      maxLevel: 0,
      subMaxLevel: 3,
      plugins: [
        function(hook) {
          hook.mounted(function() {
            requestAnimationFrame(() => {
              setupCatalogSearch().catch((error) => {
                console.warn('Nao foi possivel montar a busca do catalogo.', error);
              });
            });
          });
          hook.doneEach(function() {
            requestAnimationFrame(() => {
              setupCatalogSearch().catch((error) => {
                console.warn('Nao foi possivel montar a busca do catalogo.', error);
              });
            });
          });
        },
      ],
    };
  </script>
  <script>
    const themeLink = document.getElementById('docsify-theme');
    const themeToggle = document.getElementById('appearance-toggle');
    const themeMenu = document.getElementById('appearance-menu');
    const themeOptions = [...document.querySelectorAll('[data-theme-choice]')];
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
    const themeUrls = {
      light: '//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css',
      dark: '//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css',
    };
    const logoUrls = {
      light: 'assets/wiki-standards-horizontal.svg',
      dark: 'assets/wiki-standards-horizontal-dark.svg',
    };

    function storedTheme() {
      return localStorage.getItem('wiki-standards-theme') || 'auto';
    }

    function activeTheme(choice) {
      return choice === 'auto' ? (systemTheme.matches ? 'dark' : 'light') : choice;
    }

    function applyTheme(choice) {
      const resolvedTheme = activeTheme(choice);
      themeLink.href = themeUrls[resolvedTheme];
      document.body.dataset.themeMode = resolvedTheme;
      document.querySelectorAll('.sidebar h1 img').forEach((logo) => {
        logo.src = logoUrls[resolvedTheme];
      });
      themeOptions.forEach((option) => {
        option.setAttribute('aria-checked', String(option.dataset.themeChoice === choice));
      });
    }

    function closeThemeMenu() {
      themeMenu.hidden = true;
      themeToggle.setAttribute('aria-expanded', 'false');
    }

    function normalizeStandardCode(value) {
      return value
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toUpperCase()
        .replace(/[^A-Z0-9]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function compactSearchKey(value) {
      return normalizeStandardCode(value).replace(/\s+/g, '');
    }

    function decodeMarkdownHref(href) {
      return decodeURIComponent(href
        .replace(/\\\(/g, '(')
        .replace(/\\\)/g, ')')
        .replace(/\.md$/, ''));
    }

    function extractMarkdownLinks(text) {
      const regex = /\[([^\]]+)\]\(((?:\\.|[^)])+)\)/g;
      return [...text.matchAll(regex)].map((match) => ({
        label: match[1].trim(),
        href: decodeMarkdownHref(match[2].trim()),
      }));
    }

    function stripMarkdown(text) {
      return text
        .replace(/\[([^\]]+)\]\(((?:\\.|[^)])+)\)/g, '$1')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function parseMarkdownTableRows(text) {
      return text
        .split('\n')
        .map((line) => line.trim())
        .filter((line) => line.startsWith('|'))
        .map((line) => line.replace(/^\|/, '').replace(/\|$/, '').split('|').map((cell) => cell.trim()))
        .filter((cells) => cells.length > 1 && !cells.every((cell) => /^:?-{3,}:?$/.test(cell.replace(/\s/g, ''))));
    }

    function createSearchRecord(record) {
      return {
        kind: record.kind || 'norma',
        code: record.code,
        title: record.title || 'Norma disponível para consulta',
        family: record.family,
        href: record.href,
        aliases: [...record.aliases],
      };
    }

    function buildCatalogSearchIndex(sourceTexts) {
      const familySources = [
        { key: 'cpcs', family: 'CPC' },
        { key: 'icpcs', family: 'ICPC' },
        { key: 'nbc-ta-cta', family: 'NBC TA/CTA' },
        { key: 'nbc-tg-itg-ctg-otg', family: 'NBC TG/ITG/CTG/OTG' },
        { key: 'nbc-ti', family: 'NBC TI' },
      ];
      const recordsByHref = new Map();
      const relationRecords = new Map();

      const upsertRecord = (payload) => {
        if (!payload.href) {
          return null;
        }
        const existing = recordsByHref.get(payload.href) || {
          kind: 'norma',
          code: payload.code,
          title: '',
          family: payload.family || '',
          href: payload.href,
          aliases: new Set(),
        };
        if (payload.code) {
          existing.code = payload.code;
        }
        if (payload.title) {
          existing.title = payload.title;
        }
        if (payload.family) {
          existing.family = payload.family;
        }
        recordsByHref.set(payload.href, existing);
        return existing;
      };

      const addAliases = (record, values) => {
        values
          .map((value) => stripMarkdown(value))
          .filter((value) => value && value !== '-' && value !== '—' && value !== record.code && value !== record.title)
          .forEach((value) => record.aliases.add(value));
      };

      familySources.forEach((source) => {
        const text = sourceTexts[source.key];
        const regex = /^- \[([^\]]+)\]\(((?:\\.|[^)])+)\)/gm;
        for (const match of text.matchAll(regex)) {
          upsertRecord({
            code: match[1].trim(),
            family: source.family,
            href: decodeMarkdownHref(match[2].trim()),
          });
        }
      });

      ['cpc-map', 'icpc-map', 'nbc-ta-cta-map', 'nbc-tg-itg-ctg-map'].forEach((key) => {
        parseMarkdownTableRows(sourceTexts[key]).forEach((cells) => {
          const links = extractMarkdownLinks(cells[0]);
          if (!links.length) {
            return;
          }
          const primary = links[0];
          const record = upsertRecord({
            code: primary.label,
            href: primary.href,
          });
          if (!record) {
            return;
          }
          if (cells[1] && !record.title) {
            record.title = stripMarkdown(cells[1]);
          }
          addAliases(record, cells.slice(2));
          addAliases(record, links.slice(1).map((link) => link.label));
        });
      });

      parseMarkdownTableRows(sourceTexts.equivalencias).forEach((cells) => {
        const rowLinks = cells.flatMap((cell) => extractMarkdownLinks(cell));
        if (!rowLinks.length) {
          return;
        }

        const rowTexts = cells.map((cell) => stripMarkdown(cell)).filter((value) => value && value !== '-' && value !== '—');
        rowLinks.forEach((link) => {
          const record = upsertRecord({
            code: link.label,
            href: link.href,
          });
          if (record) {
            addAliases(record, rowTexts);
            addAliases(record, rowLinks.filter((item) => item.href !== link.href).map((item) => item.label));
          }
        });

        const ifrsLabel = rowTexts.find((value) => value.startsWith('IFRS '));
        if (!ifrsLabel) {
          return;
        }

        const normalizedIfrs = compactSearchKey(ifrsLabel);
        if (!relationRecords.has(normalizedIfrs)) {
          const relatedCodes = rowLinks.map((link) => link.label).join(' / ');
          relationRecords.set(normalizedIfrs, {
            kind: 'relacao',
            code: ifrsLabel,
            title: `Equivalência com ${relatedCodes}`,
            family: 'Equivalências',
            href: '/catalogo/equivalencias-cpc-nbc-ifrs',
            aliases: rowTexts.filter((value) => value !== ifrsLabel),
          });
        }
      });

      return [
        ...[...recordsByHref.values()].map(createSearchRecord),
        ...[...relationRecords.values()].map((record) => ({
          ...record,
          aliases: [...record.aliases],
        })),
      ].map((record) => ({
        ...record,
        codeNormalized: normalizeStandardCode(record.code),
        codeCompact: compactSearchKey(record.code),
        titleNormalized: normalizeStandardCode(record.title),
        familyNormalized: normalizeStandardCode(record.family),
        aliasNormalized: record.aliases.map((alias) => normalizeStandardCode(alias)),
        aliasCompact: record.aliases.map((alias) => compactSearchKey(alias)),
        searchableText: normalizeStandardCode([record.code, record.title, record.family, ...record.aliases].join(' ')),
      }));
    }

    let catalogSearchPromise;
    let catalogSearchContainer;

    async function loadCatalogSearchIndex() {
      if (!catalogSearchPromise) {
        const sources = {
          cpcs: '/families/cpcs.md',
          icpcs: '/families/icpcs.md',
          'nbc-ta-cta': '/families/nbc-ta-cta.md',
          'nbc-tg-itg-ctg-otg': '/families/nbc-tg-itg-ctg-otg.md',
          'nbc-ti': '/families/nbc-ti.md',
          'cpc-map': '/catalogo/cpc-map.md',
          'icpc-map': '/catalogo/icpc-map.md',
          'nbc-ta-cta-map': '/catalogo/nbc-ta-cta-map.md',
          'nbc-tg-itg-ctg-map': '/catalogo/nbc-tg-itg-ctg-map.md',
          equivalencias: '/catalogo/equivalencias-cpc-nbc-ifrs.md',
        };

        catalogSearchPromise = Promise.all(
          Object.entries(sources).map(async ([key, path]) => {
            const response = await fetch(path);
            if (!response.ok) {
              throw new Error(`Falha ao carregar ${path}`);
            }
            return [key, await response.text()];
          })
        ).then((entries) => buildCatalogSearchIndex(Object.fromEntries(entries)));
      }
      return catalogSearchPromise;
    }

    function rankCatalogSearch(records, query) {
      const normalizedQuery = normalizeStandardCode(query);
      const compactQuery = compactSearchKey(query);
      const queryTerms = normalizedQuery.split(' ').filter(Boolean);

      if (!normalizedQuery || compactQuery.length < 2) {
        return [];
      }

      return records
        .map((record) => {
          let score = 0;

          if (record.codeCompact === compactQuery) {
            score = 1000;
          } else if (record.codeNormalized === normalizedQuery) {
            score = 980;
          } else if (record.aliasCompact.includes(compactQuery)) {
            score = 900;
          } else if (record.codeCompact.startsWith(compactQuery)) {
            score = 860 - (record.codeCompact.length - compactQuery.length);
          } else if (record.codeNormalized.startsWith(normalizedQuery)) {
            score = 820 - (record.codeNormalized.length - normalizedQuery.length);
          } else if (record.titleNormalized.includes(normalizedQuery)) {
            score = 700 - record.titleNormalized.indexOf(normalizedQuery);
          } else {
            const aliasIndex = record.aliasNormalized.findIndex((alias) => alias.includes(normalizedQuery));
            if (aliasIndex >= 0) {
              score = 660 - aliasIndex;
            } else if (queryTerms.length > 1 && queryTerms.every((term) => record.searchableText.includes(term))) {
              score = 520;
            } else if (record.familyNormalized.includes(normalizedQuery)) {
              score = 320;
            }
          }

          return score > 0 ? { score, record } : null;
        })
        .filter(Boolean)
        .sort((left, right) => right.score - left.score || left.record.code.localeCompare(right.record.code, 'pt-BR'))
        .slice(0, 8)
        .map((item) => item.record);
    }

    function renderCatalogSearchResults(container, results, query) {
      if (!query.trim()) {
        container.hidden = true;
        container.innerHTML = '';
        return;
      }

      container.hidden = false;
      container.innerHTML = '';

      if (!results.length) {
        const empty = document.createElement('div');
        empty.className = 'catalog-search-empty';
        empty.textContent = 'Nenhuma norma encontrada.';
        container.appendChild(empty);
        return;
      }

      results.forEach((result, index) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'catalog-search-item';
        item.dataset.href = result.href;
        item.dataset.index = String(index);

        const code = document.createElement('span');
        code.className = 'catalog-search-code';
        code.textContent = result.code;

        const title = document.createElement('span');
        title.className = 'catalog-search-title';
        title.textContent = result.title;

        const meta = document.createElement('span');
        meta.className = 'catalog-search-meta';
        meta.textContent = result.family;

        item.appendChild(code);
        item.appendChild(title);
        item.appendChild(meta);
        container.appendChild(item);
      });
    }

    function setActiveCatalogSearchResult(container, activeIndex) {
      container.querySelectorAll('.catalog-search-item').forEach((item) => {
        item.classList.toggle('is-active', Number(item.dataset.index) === activeIndex);
      });
    }

    function navigateFromCatalogSearch(href) {
      if (!href) {
        return;
      }
      window.location.hash = `#${href}`;
    }

    async function setupCatalogSearch() {
      const records = await loadCatalogSearchIndex();
      const sidebarNav = document.querySelector('.sidebar-nav');
      if (!sidebarNav) {
        return;
      }
      if (!catalogSearchContainer) {
        const container = document.createElement('div');
        container.className = 'catalog-search';
        container.dataset.catalogSearch = 'true';
        container.innerHTML = `
          <input class="catalog-search-input" type="search" placeholder="Buscar norma ou IFRS" aria-label="Buscar norma">
          <div class="catalog-search-results" hidden></div>
        `;
        catalogSearchContainer = container;
      }

      if (catalogSearchContainer.parentElement !== sidebarNav.parentElement || catalogSearchContainer.nextElementSibling !== sidebarNav) {
        sidebarNav.insertAdjacentElement('beforebegin', catalogSearchContainer);
      }

      if (catalogSearchContainer.dataset.bound === 'true') {
        return;
      }
      catalogSearchContainer.dataset.bound = 'true';

      const input = catalogSearchContainer.querySelector('.catalog-search-input');
      const resultsPanel = catalogSearchContainer.querySelector('.catalog-search-results');
      let activeIndex = -1;
      let currentResults = [];

      const refreshResults = () => {
        currentResults = rankCatalogSearch(records, input.value);
        activeIndex = currentResults.length ? 0 : -1;
        renderCatalogSearchResults(resultsPanel, currentResults, input.value);
        setActiveCatalogSearchResult(resultsPanel, activeIndex);
      };

      input.addEventListener('input', refreshResults);
      input.addEventListener('focus', () => {
        if (input.value.trim()) {
          refreshResults();
        }
      });

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          resultsPanel.hidden = true;
          return;
        }

        if (!currentResults.length) {
          return;
        }

        if (event.key === 'ArrowDown') {
          event.preventDefault();
          activeIndex = Math.min(activeIndex + 1, currentResults.length - 1);
          setActiveCatalogSearchResult(resultsPanel, activeIndex);
          return;
        }

        if (event.key === 'ArrowUp') {
          event.preventDefault();
          activeIndex = Math.max(activeIndex - 1, 0);
          setActiveCatalogSearchResult(resultsPanel, activeIndex);
          return;
        }

        if (event.key === 'Enter') {
          event.preventDefault();
          const result = currentResults[activeIndex] || currentResults[0];
          if (result) {
            navigateFromCatalogSearch(result.href);
          }
        }
      });

      resultsPanel.addEventListener('mousedown', (event) => {
        const item = event.target.closest('.catalog-search-item');
        if (!item) {
          return;
        }
        event.preventDefault();
        navigateFromCatalogSearch(item.dataset.href);
      });

      document.addEventListener('click', (event) => {
        if (!event.target.closest('[data-catalog-search]')) {
          resultsPanel.hidden = true;
        }
      });
    }

    applyTheme(storedTheme());

    const logoObserver = new MutationObserver(() => {
      applyTheme(storedTheme());
    });
    logoObserver.observe(document.body, { childList: true, subtree: true });

    themeToggle.addEventListener('click', () => {
      const isOpen = !themeMenu.hidden;
      themeMenu.hidden = isOpen;
      themeToggle.setAttribute('aria-expanded', String(!isOpen));
    });

    themeOptions.forEach((option) => {
      option.addEventListener('click', () => {
        localStorage.setItem('wiki-standards-theme', option.dataset.themeChoice);
        applyTheme(option.dataset.themeChoice);
        closeThemeMenu();
      });
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.appearance-switcher')) {
        closeThemeMenu();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeThemeMenu();
      }
    });

    systemTheme.addEventListener('change', () => {
      if (storedTheme() === 'auto') {
        applyTheme('auto');
      }
    });

    setupCatalogSearch().catch((error) => {
      console.warn('Nao foi possivel ativar a busca do catalogo.', error);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js?v=20260520"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js?v=20260520"></script>
