<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Wiki Standards</title>
  <meta name="description" content="Biblioteca de normas contábeis organizada para consulta, navegação por família e relações entre pronunciamentos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/wiki-standards-symbol.svg">
  <link id="docsify-theme" rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --base-font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono-font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      --page-shell-padding: 28px;
      --page-content-max: 50rem;
      --page-content-padding-x: 1.5rem;
      --page-toc-width: 13.5rem;
      --page-toc-gap: 32px;
      --surface-sidebar: #f7faf8;
      --surface-content: #ffffff;
      --surface-toc: #fbfcfb;
      --surface-divider: #dce6e0;
      --appearance-bg: #ffffff;
      --appearance-border: #d9e2dd;
      --appearance-ink: #24312b;
      --appearance-muted: #5b6b63;
      --appearance-hover: #eef7f1;
      --surface-dark-1: #3f4341;
      --surface-dark-2: #3a3d3b;
      --surface-dark-3: #4a4f4c;
      --surface-dark-border: #656565;
      --surface-dark-text: #f2f2f2;
      --surface-dark-muted: #d0d0d0;
    }

    body,
    input,
    button,
    textarea,
    .sidebar,
    .markdown-section {
      font-family: var(--base-font-family);
    }

    body {
      background: var(--surface-content);
    }

    code,
    pre,
    kbd {
      font-family: var(--mono-font-family);
    }

    .content {
      background: var(--surface-content);
    }

    .markdown-section {
      max-width: var(--page-content-max);
      margin: 0 auto;
      padding-left: var(--page-content-padding-x);
      padding-right: var(--page-content-padding-x);
      font-size: 16.5px;
      line-height: 1.65;
    }

    .markdown-section table {
      font-size: 15px;
      line-height: 1.5;
    }

    .markdown-section .task-list-item {
      list-style: none;
    }

    .markdown-section .task-list-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      margin: 0 10px 0 0;
      border: 1.5px solid #7a8b82;
      border-radius: 4px;
      background: #ffffff;
      vertical-align: -3px;
      cursor: default;
      opacity: 1;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .markdown-section .task-list-item input[type="checkbox"]:checked {
      border-color: #2f7cf6;
      background: #2f7cf6;
      background-image: linear-gradient(45deg, transparent 45%, #ffffff 45%, #ffffff 55%, transparent 55%),
        linear-gradient(-45deg, transparent 44%, #ffffff 44%, #ffffff 56%, transparent 56%);
      background-size: 46% 22%, 24% 50%;
      background-position: 56% 58%, 33% 70%;
      background-repeat: no-repeat;
    }

    .markdown-section .task-list-item input[type="checkbox"]:disabled {
      cursor: default;
      opacity: 1;
    }

    .markdown-section h2 {
      margin-top: 2.4rem;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid var(--surface-divider);
    }

    .standard-header {
      margin: 0 0 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid #dce6e0;
    }

    .standard-title {
      margin: 0 0 10px;
      color: #24312b;
      font-size: 2.7rem;
      line-height: 1.1;
    }

    .standard-kicker {
      margin: 0 0 6px;
      color: #d85842;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .standard-summary {
      margin: 0;
      color: #4f6258;
      font-size: 1.55rem;
      line-height: 1.2;
    }

    .standard-summary strong {
      color: #24312b;
      font-weight: 600;
    }


    .sidebar {
      background: var(--surface-sidebar);
      border-right: 1px solid var(--surface-divider);
      box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.55);
      font-size: 15px;
      padding-top: 84px;
    }

    .sidebar-nav {
      padding: 0 18px 28px;
    }

    .sidebar-quick-group {
      margin: 0 0 18px;
      border: 1px solid #dce6e0;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.82);
      overflow: hidden;
    }

    .sidebar-quick-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: 0;
      padding: 12px 14px;
      background: transparent;
      color: #24312b;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
    }

    .sidebar-quick-toggle:hover,
    .sidebar-quick-toggle:focus-visible {
      background: #eef7f1;
      outline: none;
    }

    .sidebar-quick-toggle::after {
      content: '▾';
      color: #73837a;
      font-size: 12px;
      transition: transform 140ms ease;
    }

    .sidebar-quick-group[data-expanded="false"] .sidebar-quick-toggle::after {
      transform: rotate(-90deg);
    }

    .sidebar-quick-list {
      max-height: 280px;
      margin: 0;
      border-top: 1px solid #e6eeea;
      padding: 8px 0;
      overflow: auto;
      list-style: none;
    }

    .sidebar-quick-list[hidden] {
      display: none;
    }

    .sidebar-quick-item {
      margin: 0;
    }

    .sidebar-quick-link {
      display: block;
      padding: 7px 14px;
      color: #506158;
      font-size: 13px;
      line-height: 1.35;
      text-decoration: none;
    }

    .sidebar-quick-link:hover,
    .sidebar-quick-link:focus-visible {
      background: #f4faf6;
      color: #24312b;
      outline: none;
      text-decoration: none;
    }

    .sidebar-quick-link.is-active {
      background: #eef7f1;
      color: #24312b;
      font-weight: 700;
    }

    .sidebar-nav>ul,
    .sidebar-nav>p {
      margin-left: 0;
      padding-left: 0;
    }

    .sidebar-nav ul {
      list-style: none;
      padding-left: 0;
    }

    .sidebar-nav li {
      margin: 7px 0;
    }

    .sidebar-nav .app-sub-sidebar {
      margin: 8px 0 14px;
      padding-left: 14px;
      border-left: 1px solid rgba(91, 107, 99, 0.16);
    }

    .sidebar-nav .app-sub-sidebar li {
      margin: 8px 0;
      padding-left: 0;
    }

    .sidebar-nav .app-sub-sidebar a {
      color: #506158;
      font-size: 14px;
    }

    .sidebar-nav>ul>li.active>a {
      position: relative;
      padding-left: 14px;
    }

    .sidebar-nav>ul>li.active>a::before {
      content: '⌄';
      position: absolute;
      left: 0;
      top: 2px;
      color: #d85842;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
    }

    .sidebar-nav .app-sub-sidebar li.active>a {
      padding-left: 0;
    }

    .sidebar-nav .app-sub-sidebar li.active>a::before {
      content: none;
    }

    .sidebar-nav a {
      display: inline-block;
      padding: 3px 0;
      line-height: 1.45;
    }

    .sidebar-nav strong {
      display: block;
      margin: 22px 0 10px;
      color: #24312b;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .sidebar>h1 {
      margin: 20px 12px 22px;
    }

    .sidebar>h1 .app-name-link {
      display: flex;
      justify-content: center;
    }

    .sidebar>h1 img {
      width: min(248px, 88%);
      height: auto;
    }

    .home-hero {
      margin: 18px auto 44px;
      text-align: center;
    }

    .home-logo {
      width: min(460px, 90%);
      height: auto;
      margin: 0 auto 18px;
    }

    .home-hero p {
      max-width: 680px;
      margin: 0 auto;
      color: #5b6b63;
      font-size: 17px;
      line-height: 1.6;
    }

    .home-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: 0 auto 44px;
      max-width: 1020px;
    }

    .home-card {
      display: flex;
      min-height: 150px;
      min-width: 0;
      flex-direction: column;
      gap: 8px;
      border: 1px solid #dce6e0;
      border-radius: 18px;
      padding: 22px;
      background: linear-gradient(145deg, #ffffff 0%, #f4faf6 100%);
      box-shadow: 0 14px 34px rgba(36, 49, 43, 0.08);
      color: #24312b;
      text-decoration: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .home-card:hover,
    .home-card:focus-visible {
      border-color: #ff9a85;
      box-shadow: 0 18px 42px rgba(36, 49, 43, 0.14);
      color: #24312b;
      outline: none;
      text-decoration: none;
      transform: translateY(-2px);
    }

    .home-card strong {
      font-size: 21px;
      line-height: 1.2;
      color: inherit;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .home-card span:last-child {
      color: #5b6b63;
      line-height: 1.55;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .appearance-switcher {
      position: fixed;
      top: 12px;
      left: 316px;
      z-index: 1000;
    }

    .appearance-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--appearance-border);
      border-radius: 999px;
      background: var(--appearance-bg);
      color: var(--appearance-ink);
      box-shadow: 0 8px 24px rgba(23, 36, 29, 0.12);
      cursor: pointer;
      line-height: 1;
    }

    .appearance-toggle svg {
      width: 21px;
      height: 21px;
      stroke-width: 2;
    }

    .appearance-toggle:hover,
    .appearance-toggle:focus-visible {
      background: var(--appearance-hover);
      outline: none;
    }

    .appearance-menu {
      position: absolute;
      top: 48px;
      left: 0;
      min-width: 150px;
      padding: 6px;
      border: 1px solid var(--appearance-border);
      border-radius: 8px;
      background: var(--appearance-bg);
      box-shadow: 0 14px 34px rgba(23, 36, 29, 0.16);
    }

    .appearance-menu[hidden] {
      display: none;
    }

    .revoked-switcher {
      position: fixed;
      top: 12px;
      left: 366px;
      z-index: 1000;
    }

    body[data-catalog-search-open="true"] .appearance-switcher,
    body[data-catalog-search-open="true"] .revoked-switcher {
      z-index: 20;
      opacity: 0.45;
      filter: saturate(0.6);
      pointer-events: none;
      transition: opacity 120ms ease, filter 120ms ease;
    }

    .revoked-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      border: 1px solid var(--appearance-border);
      border-radius: 999px;
      padding: 0 14px;
      background: var(--appearance-bg);
      color: var(--appearance-ink);
      box-shadow: 0 8px 24px rgba(23, 36, 29, 0.12);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
    }

    .revoked-toggle:hover,
    .revoked-toggle:focus-visible {
      background: var(--appearance-hover);
      outline: none;
    }

    .revoked-toggle-indicator {
      display: inline-flex;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #d85842;
      box-shadow: 0 0 0 3px rgba(216, 88, 66, 0.14);
      flex: 0 0 auto;
    }

    .revoked-fragment {
      display: inline;
    }

    .revoked-placeholder {
      display: none;
      color: #7a8a81;
      font-size: 0.94em;
      font-style: italic;
    }

    body[data-hide-revoked="true"] .markdown-section .revoked-fragment del {
      display: none;
    }

    body[data-hide-revoked="true"] .markdown-section .revoked-placeholder {
      display: inline;
    }

    .catalog-search-launcher {
      position: fixed;
      top: 0;
      left: 18px;
      z-index: 44;
      display: flex;
      align-items: center;
      gap: 10px;
      width: calc(300px - 36px);
      border: 1px solid #d5dfda;
      border-top: 0;
      border-radius: 0 0 14px 14px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 24px rgba(36, 49, 43, 0.08);
      color: #24312b;
      cursor: pointer;
      box-sizing: border-box;
      text-align: left;
    }

    .catalog-search-launcher:hover,
    .catalog-search-launcher:focus-visible {
      background: #f7fbf8;
      outline: none;
    }

    .catalog-search-launcher-icon {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      color: #73837a;
    }

    .catalog-search-launcher-label {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      color: inherit;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .catalog-search-shortcut {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      border: 1px solid #d5dfda;
      border-radius: 7px;
      background: #f7faf8;
      color: #73837a;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .catalog-search {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 10vh 16px 24px;
      background: rgba(17, 23, 20, 0.42);
      backdrop-filter: blur(14px);
      box-sizing: border-box;
    }

    .catalog-search[hidden] {
      display: none;
    }

    .catalog-search-backdrop {
      position: absolute;
      inset: 0;
    }

    .catalog-search-modal {
      position: relative;
      z-index: 1;
      width: min(760px, calc(100vw - 32px));
      border: 1px solid #d5dfda;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 30px 80px rgba(13, 18, 15, 0.24);
      overflow: hidden;
    }

    .catalog-search-panel {
      padding: 18px;
    }

    .catalog-search-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .catalog-search-header-text {
      min-width: 0;
      flex: 1 1 auto;
    }

    .catalog-search-titleline {
      margin: 0;
      color: #24312b;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .catalog-search-help {
      margin: 2px 0 0;
      color: #627268;
      font-size: 13px;
      line-height: 1.35;
    }

    .catalog-search-close {
      flex: 0 0 auto;
      border: 1px solid #d5dfda;
      border-radius: 10px;
      padding: 8px 10px;
      background: #f7faf8;
      color: #5b6b63;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
    }

    .catalog-search-close:hover,
    .catalog-search-close:focus-visible {
      background: #eef7f1;
      color: #24312b;
      outline: none;
    }

    .catalog-search-field {
      position: relative;
    }

    .catalog-search-input {
      width: 100%;
      border: 1px solid #d5dfda;
      border-radius: 12px;
      padding: 12px 46px 12px 14px;
      background: #ffffff;
      color: #24312b;
      font-size: 15px;
      line-height: 1.2;
    }

    .catalog-search-input::placeholder {
      color: #708177;
    }

    .catalog-search-input:focus-visible {
      border-color: #ff9a85;
      outline: 2px solid rgba(255, 115, 92, 0.16);
      outline-offset: 1px;
    }

    .catalog-search-field .catalog-search-shortcut {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
    }

    .catalog-search-results {
      margin-top: 12px;
      max-height: min(56vh, 560px);
      overflow: auto;
      border: 1px solid #d5dfda;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .catalog-search-results[hidden] {
      display: none;
    }

    .catalog-search-item {
      display: block;
      width: 100%;
      border: 0;
      border-top: 1px solid #edf3ef;
      padding: 12px 14px;
      background: transparent;
      color: #24312b;
      cursor: pointer;
      text-align: left;
    }

    .catalog-search-item:first-child {
      border-top: 0;
    }

    .catalog-search-item:hover,
    .catalog-search-item:focus-visible,
    .catalog-search-item.is-active {
      background: #f6fbf8;
      outline: none;
    }

    .catalog-search-code {
      display: block;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }

    .catalog-search-title {
      display: block;
      margin-top: 3px;
      color: #506158;
      font-size: 13px;
      line-height: 1.4;
    }

    .catalog-search-meta {
      display: block;
      margin-top: 6px;
      color: #7a8a81;
      font-size: 12px;
      line-height: 1.35;
    }

    .catalog-search-empty {
      padding: 12px 14px;
      color: #5b6b63;
      font-size: 13px;
      line-height: 1.4;
    }

    .page-toc {
      display: none;
    }

    @media (min-width: 1280px) {
      body.has-page-toc .content {
        right: calc(var(--page-shell-padding) + var(--page-toc-width) + var(--page-toc-gap));
      }

      .page-toc {
        position: fixed;
        top: 104px;
        right: var(--page-shell-padding);
        z-index: 20;
        display: block;
        width: var(--page-toc-width);
        max-height: calc(100vh - 132px);
        overflow: auto;
        box-sizing: border-box;
        padding: 14px 22px 14px 0;
        background: var(--surface-toc);
        border-left: 1px solid var(--surface-divider);
        box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.72);
        scrollbar-gutter: stable;
      }

      .page-toc[hidden] {
        display: none;
      }

      .page-toc-title {
        margin: 0 0 12px;
        color: #4f6258;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .page-toc-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .page-toc-item {
        margin: 0;
      }

      .page-toc-group + .page-toc-group {
        margin-top: 4px;
      }

      .page-toc-group-row {
        display: flex;
        align-items: flex-start;
        gap: 6px;
      }

      .page-toc-toggle {
        flex: 0 0 auto;
        width: 16px;
        height: 28px;
        margin: 0;
        border: 0;
        padding: 0;
        background: transparent;
        color: #73837a;
        cursor: pointer;
        font-size: 11px;
        line-height: 1;
      }

      .page-toc-toggle::before {
        content: '▸';
        display: block;
        transform-origin: 50% 50%;
        transition: transform 140ms ease;
      }

      .page-toc-group.is-expanded > .page-toc-group-row .page-toc-toggle::before {
        transform: rotate(90deg);
      }

      .page-toc-toggle:hover,
      .page-toc-toggle:focus-visible {
        color: #24312b;
        outline: none;
      }

      .page-toc-group-label {
        flex: 1 1 auto;
        min-width: 0;
      }

      .page-toc-link {
        display: block;
        padding: 5px 0 5px 8px;
        color: #4f6258;
        text-decoration: none;
        line-height: 1.4;
        border-left: 2px solid transparent;
      }

      .page-toc-link:hover,
      .page-toc-link:focus-visible {
        color: #24312b;
        text-decoration: none;
        outline: none;
      }

      .page-toc-link.is-active {
        color: #24312b;
        border-left-color: #d85842;
        font-weight: 600;
      }

      .page-toc-item[data-level="1"] .page-toc-link {
        padding-left: 0;
        font-size: 13px;
        font-weight: 600;
      }

      .page-toc-item[data-level="2"] .page-toc-link {
        padding-left: 1.25rem;
        font-size: 12.5px;
      }

      .page-toc-item[data-level="3"] .page-toc-link {
        padding-left: 2.1rem;
        font-size: 12px;
      }

      .page-toc-children {
        margin: 2px 0 0;
        padding: 0;
        list-style: none;
      }

      .page-toc-children[hidden] {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .appearance-switcher {
        left: 16px;
      }

      .revoked-switcher {
        left: 68px;
      }

      .sidebar {
        padding-top: 0;
      }

      .catalog-search-launcher {
        left: 16px;
        width: calc(100vw - 32px);
      }

      .catalog-search-panel {
        padding: 14px;
      }

      .catalog-search-header {
        margin-bottom: 10px;
      }

      .catalog-search-titleline {
        font-size: 15px;
      }

  <script>
    const originalFetch = window.fetch.bind(window);
    const cacheBuster = '20260520';

    // Docsify busca os arquivos dinamicamente; forcar no-store e versionamento
    // evita que home, sidebar e catalogo fiquem presos em cache antigo.
    window.fetch = function(resource, config = {}) {
      let nextResource = resource;

      if (typeof nextResource === 'string' && !/^https?:\/\//i.test(nextResource) && /\.(md|json)$/i.test(nextResource)) {
        const separator = nextResource.includes('?') ? '&' : '?';
        nextResource = `${nextResource}${separator}v=${cacheBuster}`;
      }

      return originalFetch(nextResource, {
        ...config,
        cache: 'no-store',
      });
    };

    window.$docsify = {
      name: 'Wiki Standards',
      logo: 'assets/wiki-standards-horizontal.svg',
      auto2top: true,
      homepage: 'home.md',
      loadSidebar: true,
      maxLevel: 0,
      subMaxLevel: 0,
    };
  </script>
  <script>
    const themeLink = document.getElementById('docsify-theme');
    const themeToggle = document.getElementById('appearance-toggle');
    const themeMenu = document.getElementById('appearance-menu');
    const themeOptions = [...document.querySelectorAll('[data-theme-choice]')];
    const revokedToggle = document.getElementById('revoked-toggle');
    const revokedToggleLabel = document.getElementById('revoked-toggle-label');
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
    const themeUrls = {
      light: '//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css',
      dark: '//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css',
    };
    const logoUrls = {
      light: 'assets/wiki-standards-horizontal.svg',
      dark: 'assets/wiki-standards-horizontal-dark.svg',
    };
    function storedTheme() {
      return localStorage.getItem('wiki-standards-theme') || 'auto';
    }

    function storedRevokedPreference() {
      return localStorage.getItem('wiki-standards-hide-revoked') === 'true';
    }

    function activeTheme(choice) {
      return choice === 'auto' ? (systemTheme.matches ? 'dark' : 'light') : choice;
    }

    function applyTheme(choice) {
      const resolvedTheme = activeTheme(choice);
      themeLink.href = themeUrls[resolvedTheme];
      document.body.dataset.themeMode = resolvedTheme;
      document.querySelectorAll('.sidebar h1 img, .home-logo').forEach((logo) => {
        logo.src = logoUrls[resolvedTheme];
      });
      themeOptions.forEach((option) => {
        option.setAttribute('aria-checked', String(option.dataset.themeChoice === choice));
      });
    }

    function closeThemeMenu() {
      themeMenu.hidden = true;
      themeToggle.setAttribute('aria-expanded', 'false');
    }

    function applyRevokedPreference(hidden) {
      document.body.dataset.hideRevoked = hidden ? 'true' : 'false';
      if (revokedToggle) {
        revokedToggle.setAttribute('aria-pressed', String(hidden));
      }
      if (revokedToggleLabel) {
        revokedToggleLabel.textContent = hidden ? 'Mostrar revogado' : 'Recolher revogado';
      }
    }

    function enhanceRevokedSections() {
      document.querySelectorAll('.markdown-section del').forEach((node) => {
        if (node.parentElement && node.parentElement.classList.contains('revoked-fragment')) {
          return;
        }

        const wrapper = document.createElement('span');
        wrapper.className = 'revoked-fragment';

        const placeholder = document.createElement('span');
        placeholder.className = 'revoked-placeholder';
        placeholder.textContent = '[trecho revogado oculto]';

        node.parentNode.insertBefore(wrapper, node);
        wrapper.appendChild(placeholder);
        wrapper.appendChild(node);
      });
    }

    function normalizeStandardCode(value) {
      return value
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toUpperCase()
        .replace(/[^A-Z0-9]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function compactSearchKey(value) {
      return normalizeStandardCode(value).replace(/\s+/g, '');
    }

    function decodeMarkdownHref(href) {
      return decodeURIComponent(href
        .replace(/\\\(/g, '(')
        .replace(/\\\)/g, ')')
        .replace(/\.md$/, ''));
    }

    let tocScrollFrame = null;

    function setTocGroupExpanded(group, expanded) {
      if (!group) {
        return;
      }

      group.classList.toggle('is-expanded', expanded);
      const toggle = group.querySelector('.page-toc-toggle');
      const children = group.querySelector('.page-toc-children');

      if (toggle) {
        toggle.setAttribute('aria-expanded', String(expanded));
      }

      if (children) {
        children.hidden = !expanded;
      }
    }

    function syncTocGroupExpansion(activeId) {
      document.querySelectorAll('.page-toc-group').forEach((group) => {
        const children = group.querySelector('.page-toc-children');
        if (!children) {
          return;
        }

        const containsActive = !!group.querySelector(`.page-toc-link[data-target-id="${activeId}"]`);
        setTocGroupExpanded(group, containsActive);
      });
    }

    function updatePageTocActive() {
      const links = [...document.querySelectorAll('.page-toc-link')];
      if (!links.length) {
        return;
      }

      const headings = links
        .map((link) => document.getElementById(link.dataset.targetId))
        .filter(Boolean);

      if (!headings.length) {
        return;
      }

      const threshold = 132;
      let activeId = headings[0].id;

      headings.forEach((heading) => {
        if (heading.getBoundingClientRect().top <= threshold) {
          activeId = heading.id;
        }
      });

      links.forEach((link) => {
        link.classList.toggle('is-active', link.dataset.targetId === activeId);
      });

      syncTocGroupExpansion(activeId);
    }

    function schedulePageTocActiveUpdate() {
      if (tocScrollFrame !== null) {
        return;
      }

      tocScrollFrame = window.requestAnimationFrame(() => {
        tocScrollFrame = null;
        updatePageTocActive();
      });
    }

    function renderPageToc() {
      const host = document.getElementById('page-toc');
      const content = document.getElementById('page-toc-content');
      const article = document.querySelector('.markdown-section');

      if (!host || !content || !article) {
        return;
      }

      const headings = [...article.querySelectorAll('h2[id], h3[id]')]
        .filter((heading) => heading.textContent.trim());

      if (!headings.length) {
        host.hidden = true;
        content.innerHTML = '';
        document.body.classList.remove('has-page-toc');
        return;
      }

      const routePath = window.location.hash.replace(/^#\//, '').split('?')[0].split('#')[0];
      const list = document.createElement('ul');
      list.className = 'page-toc-list';

      const groups = [];
      let currentGroup = null;

      headings.forEach((heading) => {
        const level = Number(heading.tagName.slice(1));

        if (level === 2 || !currentGroup) {
          currentGroup = {
            heading,
            children: [],
          };
          groups.push(currentGroup);
          return;
        }

        if (level === 3) {
          currentGroup.children.push(heading);
        }
      });

      groups.forEach((group) => {
        const item = document.createElement('li');
        item.className = 'page-toc-item page-toc-group';
        item.dataset.level = '2';
        item.dataset.groupId = group.heading.id;

        const row = document.createElement('div');
        row.className = 'page-toc-group-row';

        if (group.children.length) {
          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'page-toc-toggle';
          toggle.setAttribute('aria-label', `Alternar subseções de ${group.heading.textContent.trim()}`);
          toggle.setAttribute('aria-expanded', 'false');
          toggle.addEventListener('click', () => {
            const isExpanded = item.classList.contains('is-expanded');
            setTocGroupExpanded(item, !isExpanded);
          });
          row.appendChild(toggle);
        }

        const labelWrap = document.createElement('div');
        labelWrap.className = 'page-toc-group-label';

        const link = document.createElement('a');
        link.className = 'page-toc-link';
        link.href = `#/${routePath}?id=${group.heading.id}`;
        link.dataset.targetId = group.heading.id;
        link.textContent = group.heading.textContent.trim();
        labelWrap.appendChild(link);
        row.appendChild(labelWrap);
        item.appendChild(row);

        if (group.children.length) {
          const childList = document.createElement('ul');
          childList.className = 'page-toc-children';
          childList.hidden = true;

          group.children.forEach((heading) => {
            const childItem = document.createElement('li');
            childItem.className = 'page-toc-item';
            childItem.dataset.level = '3';

            const childLink = document.createElement('a');
            childLink.className = 'page-toc-link';
            childLink.href = `#/${routePath}?id=${heading.id}`;
            childLink.dataset.targetId = heading.id;
            childLink.textContent = heading.textContent.trim();

            childItem.appendChild(childLink);
            childList.appendChild(childItem);
          });

          item.appendChild(childList);
        }

        list.appendChild(item);
      });

      content.innerHTML = '';
      content.appendChild(list);
      host.hidden = false;
      document.body.classList.add('has-page-toc');
      updatePageTocActive();
    }

    function extractMarkdownLinks(text) {
      const regex = /\[([^\]]+)\]\(((?:\\.|[^)])+)\)/g;
      return [...text.matchAll(regex)].map((match) => ({
        label: match[1].trim(),
        href: decodeMarkdownHref(match[2].trim()),
      }));
    }

    function stripMarkdown(text) {
      return text
        .replace(/\[([^\]]+)\]\(((?:\\.|[^)])+)\)/g, '$1')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function parseMarkdownTableRows(text) {
      return text
        .split('\n')
        .map((line) => line.trim())
        .filter((line) => line.startsWith('|'))
        .map((line) => line.replace(/^\|/, '').replace(/\|$/, '').split('|').map((cell) => cell.trim()))
        .filter((cells) => cells.length > 1 && !cells.every((cell) => /^:?-{3,}:?$/.test(cell.replace(/\s/g, ''))));
    }

    function createSearchRecord(record) {
      return {
        kind: record.kind || 'norma',
        code: record.code,
        title: record.title || 'Norma disponível para consulta',
        family: record.family,
        href: record.href,
        aliases: [...record.aliases],
      };
    }

    function labelSearchKind(kind) {
      const labels = {
        norma: 'Norma',
        relacao: 'Equivalência',
      };
      return labels[kind] || 'Consulta';
    }

    function resolveSitePath(path) {
      const cleanPath = String(path || '').replace(/^\/+/, '');
      const { pathname } = window.location;
      const marker = '/#/';
      const hashIndex = pathname.indexOf(marker);
      const basePath = hashIndex >= 0
        ? pathname.slice(0, hashIndex + 1)
        : pathname.replace(/[^/]*$/, '');
      return `${basePath}${cleanPath}`;
    }

    function parseCpcQuickLinks(markdown) {
      return parseMarkdownTableRows(markdown)
        .map((cells) => extractMarkdownLinks(cells[0])[0])
        .filter(Boolean)
        .map((link) => ({
          code: stripMarkdown(link.label),
          href: link.href,
        }));
    }

    function sortCpcQuickLinks(links) {
      return [...links].sort((left, right) => left.code.localeCompare(right.code, 'pt-BR', { numeric: true }));
    }

    function buildCatalogSearchIndex(sourceTexts) {
      const recordsByHref = new Map();
      const relationRecords = new Map();

      const upsertRecord = (payload) => {
        if (!payload.href) {
          return null;
        }
        const existing = recordsByHref.get(payload.href) || {
          kind: 'norma',
          code: payload.code,
          title: '',
          family: payload.family || '',
          href: payload.href,
          aliases: new Set(),
        };
        if (payload.code) {
          existing.code = payload.code;
        }
        if (payload.title) {
          existing.title = payload.title;
        }
        if (payload.family) {
          existing.family = payload.family;
        }
        recordsByHref.set(payload.href, existing);
        return existing;
      };

      const addAliases = (record, values) => {
        values
          .map((value) => stripMarkdown(value))
          .filter((value) => value && value !== '-' && value !== '—' && value !== record.code && value !== record.title)
          .forEach((value) => record.aliases.add(value));
      };

      [
        { key: 'cpc-map', family: 'CPC' },
        { key: 'icpc-map', family: 'ICPC' },
        { key: 'nbc-ta-cta-map', family: 'NBC TA/CTA' },
        { key: 'nbc-tg-itg-ctg-map', family: 'NBC TG/ITG/CTG' },
      ].forEach((source) => {
        const key = source.key;
        parseMarkdownTableRows(sourceTexts[key]).forEach((cells) => {
          const links = extractMarkdownLinks(cells[0]);
          if (!links.length) {
            return;
          }
          const primary = links[0];
          const record = upsertRecord({
            code: primary.label,
            href: primary.href,
            family: source.family,
          });
          if (!record) {
            return;
          }
          if (cells[1] && !record.title) {
            record.title = stripMarkdown(cells[1]);
          }
          addAliases(record, cells.slice(2));
          addAliases(record, links.slice(1).map((link) => link.label));
        });
      });

      parseMarkdownTableRows(sourceTexts.equivalencias).forEach((cells) => {
        const rowLinks = cells.flatMap((cell) => extractMarkdownLinks(cell));
        if (!rowLinks.length) {
          return;
        }

        const rowTexts = cells.map((cell) => stripMarkdown(cell)).filter((value) => value && value !== '-' && value !== '—');
        rowLinks.forEach((link) => {
          const record = upsertRecord({
            code: link.label,
            href: link.href,
          });
          if (record) {
            addAliases(record, rowTexts);
            addAliases(record, rowLinks.filter((item) => item.href !== link.href).map((item) => item.label));
          }
        });

        const ifrsLabel = rowTexts.find((value) => value.startsWith('IFRS '));
        if (!ifrsLabel) {
          return;
        }

        const normalizedIfrs = compactSearchKey(ifrsLabel);
        if (!relationRecords.has(normalizedIfrs)) {
          const relatedCodes = rowLinks.map((link) => link.label).join(' / ');
          relationRecords.set(normalizedIfrs, {
            kind: 'relacao',
            code: ifrsLabel,
            title: `Equivalência com ${relatedCodes}`,
            family: 'Equivalências',
            href: '/catalogo/equivalencias-cpc-nbc-ifrs',
            aliases: rowTexts.filter((value) => value !== ifrsLabel),
          });
        }
      });

      return [
        ...[...recordsByHref.values()].map(createSearchRecord),
        ...[...relationRecords.values()].map((record) => ({
          ...record,
          aliases: [...record.aliases],
        })),
      ].map((record) => ({
        ...record,
        codeNormalized: normalizeStandardCode(record.code),
        codeCompact: compactSearchKey(record.code),
        titleNormalized: normalizeStandardCode(record.title),
        familyNormalized: normalizeStandardCode(record.family),
        aliasNormalized: record.aliases.map((alias) => normalizeStandardCode(alias)),
        aliasCompact: record.aliases.map((alias) => compactSearchKey(alias)),
        searchableText: normalizeStandardCode([record.code, record.title, record.family, ...record.aliases].join(' ')),
      }));
    }

    let catalogSearchPromise;
    async function loadCatalogSearchIndex() {
      if (!catalogSearchPromise) {
        const sources = {
          'cpc-map': 'catalogo/cpc-map.md',
          'icpc-map': 'catalogo/icpc-map.md',
          'nbc-ta-cta-map': 'catalogo/nbc-ta-cta-map.md',
          'nbc-tg-itg-ctg-map': 'catalogo/nbc-tg-itg-ctg-map.md',
          equivalencias: 'catalogo/equivalencias-cpc-nbc-ifrs.md',
        };

        catalogSearchPromise = Promise.all(
          Object.entries(sources).map(async ([key, path]) => {
            const response = await fetch(resolveSitePath(path));
            if (!response.ok) {
              throw new Error(`Falha ao carregar ${path}`);
            }
            return [key, await response.text()];
          })
        ).then((entries) => buildCatalogSearchIndex(Object.fromEntries(entries)));
      }
      return catalogSearchPromise;
    }

    let cpcQuickLinksPromise;
    async function loadCpcQuickLinks() {
      if (!cpcQuickLinksPromise) {
        cpcQuickLinksPromise = fetch(resolveSitePath('catalogo/cpc-map.md'))
          .then((response) => {
            if (!response.ok) {
              throw new Error('Falha ao carregar catalogo/cpc-map.md');
            }
            return response.text();
          })
          .then(parseCpcQuickLinks)
          .then(sortCpcQuickLinks);
      }
      return cpcQuickLinksPromise;
    }

    function currentRoutePath() {
      return `/${window.location.hash.replace(/^#\/?/, '').split('?')[0].replace(/^\/?/, '')}`.replace(/\/+$/, '');
    }

    async function setupCpcQuickJump() {
      const sidebarNav = document.querySelector('.sidebar-nav');
      if (!sidebarNav) {
        return;
      }

      let host = sidebarNav.querySelector('[data-cpc-quick-jump]');
      if (!host) {
        host = document.createElement('section');
        host.className = 'sidebar-quick-group';
        host.dataset.cpcQuickJump = 'true';
        host.dataset.expanded = 'false';
        host.innerHTML = `
          <button class="sidebar-quick-toggle" type="button" aria-expanded="false">Normas CPC</button>
          <ul class="sidebar-quick-list" hidden></ul>
        `;
        sidebarNav.prepend(host);
      }

      const toggle = host.querySelector('.sidebar-quick-toggle');
      const list = host.querySelector('.sidebar-quick-list');
      if (!toggle || !list) {
        return;
      }

      if (host.dataset.bound !== 'true') {
        host.dataset.bound = 'true';
        toggle.addEventListener('click', () => {
          const expanded = host.dataset.expanded === 'true';
          host.dataset.expanded = expanded ? 'false' : 'true';
          toggle.setAttribute('aria-expanded', String(!expanded));
          list.hidden = expanded;
        });
      }

      const links = await loadCpcQuickLinks();
      const routePath = currentRoutePath();
      list.innerHTML = '';

      links.forEach((entry) => {
        const item = document.createElement('li');
        item.className = 'sidebar-quick-item';

        const link = document.createElement('a');
        link.className = 'sidebar-quick-link';
        link.href = `#${entry.href}`;
        link.textContent = entry.code;
        if (entry.href === routePath) {
          link.classList.add('is-active');
          host.dataset.expanded = 'true';
          toggle.setAttribute('aria-expanded', 'true');
          list.hidden = false;
        }

        item.appendChild(link);
        list.appendChild(item);
      });

      if (host.dataset.expanded !== 'true') {
        toggle.setAttribute('aria-expanded', 'false');
        list.hidden = true;
      }
    }

    function rankCatalogSearch(records, query) {
      const normalizedQuery = normalizeStandardCode(query);
      const compactQuery = compactSearchKey(query);
      const queryTerms = normalizedQuery.split(' ').filter(Boolean);

      if (!normalizedQuery || compactQuery.length < 2) {
        return [];
      }

      return records
        .map((record) => {
          let score = 0;

          if (record.codeCompact === compactQuery) {
            score = 1000;
          } else if (record.codeNormalized === normalizedQuery) {
            score = 980;
          } else if (record.aliasCompact.includes(compactQuery)) {
            score = 900;
          } else if (record.codeCompact.startsWith(compactQuery)) {
            score = 860 - (record.codeCompact.length - compactQuery.length);
          } else if (record.codeNormalized.startsWith(normalizedQuery)) {
            score = 820 - (record.codeNormalized.length - normalizedQuery.length);
          } else if (record.titleNormalized.includes(normalizedQuery)) {
            score = 700 - record.titleNormalized.indexOf(normalizedQuery);
          } else {
            const aliasIndex = record.aliasNormalized.findIndex((alias) => alias.includes(normalizedQuery));
            if (aliasIndex >= 0) {
              score = 660 - aliasIndex;
            } else if (queryTerms.length > 1 && queryTerms.every((term) => record.searchableText.includes(term))) {
              score = 520;
            } else if (record.familyNormalized.includes(normalizedQuery)) {
              score = 320;
            }
          }

          return score > 0 ? { score, record } : null;
        })
        .filter(Boolean)
        .sort((left, right) => right.score - left.score || left.record.code.localeCompare(right.record.code, 'pt-BR'))
        .slice(0, 8)
        .map((item) => item.record);
    }

    function renderCatalogSearchResults(container, results, query) {
      if (!query.trim()) {
        container.hidden = true;
        container.innerHTML = '';
        return;
      }

      container.hidden = false;
      container.innerHTML = '';

      if (!results.length) {
        const empty = document.createElement('div');
        empty.className = 'catalog-search-empty';
        empty.textContent = 'Nenhuma norma encontrada.';
        container.appendChild(empty);
        return;
      }

      results.forEach((result, index) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'catalog-search-item';
        item.dataset.href = result.href;
        item.dataset.index = String(index);

        const code = document.createElement('span');
        code.className = 'catalog-search-code';
        code.textContent = result.code;

        const title = document.createElement('span');
        title.className = 'catalog-search-title';
        title.textContent = result.title;

        const meta = document.createElement('span');
        meta.className = 'catalog-search-meta';
        meta.textContent = [labelSearchKind(result.kind), result.family].filter(Boolean).join(' · ');

        item.appendChild(code);
        item.appendChild(title);
        item.appendChild(meta);
        container.appendChild(item);
      });
    }

    function setActiveCatalogSearchResult(container, activeIndex) {
      container.querySelectorAll('.catalog-search-item').forEach((item) => {
        item.classList.toggle('is-active', Number(item.dataset.index) === activeIndex);
      });
    }

    function navigateFromCatalogSearch(href) {
      if (!href) {
        return;
      }
      window.location.hash = `#${href}`;
    }

    async function setupCatalogSearch() {
      const container = document.getElementById('catalog-search-host');
      const launcher = document.getElementById('catalog-search-launcher');
      const closeButton = document.getElementById('catalog-search-close');
      const input = document.getElementById('catalog-search-input');
      const resultsPanel = document.getElementById('catalog-search-results');
      if (!container || !launcher || !closeButton || !input || !resultsPanel) {
        return;
      }
      if (container.dataset.bound === 'true') {
        return;
      }
      container.dataset.bound = 'true';
      let records = [];
      let activeIndex = -1;
      let currentResults = [];
      let isReady = false;
      let previousBodyOverflow = '';
      const focusSearchInput = () => {
        input.focus();
        input.select();
      };

      const openCatalogSearch = () => {
        if (!container.hidden) {
          focusSearchInput();
          return;
        }

        previousBodyOverflow = document.body.style.overflow;
        container.hidden = false;
        launcher.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
        document.body.dataset.catalogSearchOpen = 'true';

        window.requestAnimationFrame(() => {
          focusSearchInput();
          if (input.value.trim()) {
            currentResults = rankCatalogSearch(records, input.value);
            activeIndex = currentResults.length ? 0 : -1;
            renderCatalogSearchResults(resultsPanel, currentResults, input.value);
            setActiveCatalogSearchResult(resultsPanel, activeIndex);
          }
        });
      };

      const closeCatalogSearch = () => {
        if (container.hidden) {
          return;
        }

        container.hidden = true;
        launcher.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = previousBodyOverflow;
        delete document.body.dataset.catalogSearchOpen;
        resultsPanel.hidden = true;
        launcher.focus();
      };

      const showUnavailableMessage = () => {
        activeIndex = -1;
        currentResults = [];
        resultsPanel.hidden = false;
        resultsPanel.innerHTML = '<div class="catalog-search-empty">A busca ainda nao conseguiu carregar o catalogo.</div>';
      };

      const refreshResults = () => {
        if (!isReady) {
          showUnavailableMessage();
          return;
        }
        currentResults = rankCatalogSearch(records, input.value);
        activeIndex = currentResults.length ? 0 : -1;
        renderCatalogSearchResults(resultsPanel, currentResults, input.value);
        setActiveCatalogSearchResult(resultsPanel, activeIndex);
      };

      input.addEventListener('input', refreshResults);
      input.addEventListener('focus', () => {
        if (input.value.trim()) {
          refreshResults();
        }
      });

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeCatalogSearch();
          return;
        }

        if (!currentResults.length) {
          return;
        }

        if (event.key === 'ArrowDown') {
          event.preventDefault();
          activeIndex = Math.min(activeIndex + 1, currentResults.length - 1);
          setActiveCatalogSearchResult(resultsPanel, activeIndex);
          return;
        }

        if (event.key === 'ArrowUp') {
          event.preventDefault();
          activeIndex = Math.max(activeIndex - 1, 0);
          setActiveCatalogSearchResult(resultsPanel, activeIndex);
          return;
        }

        if (event.key === 'Enter') {
          event.preventDefault();
          const result = currentResults[activeIndex] || currentResults[0];
          if (result) {
            closeCatalogSearch();
            navigateFromCatalogSearch(result.href);
          }
        }
      });

      resultsPanel.addEventListener('mousedown', (event) => {
        const item = event.target.closest('.catalog-search-item');
        if (!item) {
          return;
        }
        event.preventDefault();
        closeCatalogSearch();
        navigateFromCatalogSearch(item.dataset.href);
      });

      launcher.addEventListener('click', () => {
        openCatalogSearch();
      });

      closeButton.addEventListener('click', () => {
        closeCatalogSearch();
      });

      container.addEventListener('click', (event) => {
        if (event.target.closest('[data-catalog-search-close]')) {
          closeCatalogSearch();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.defaultPrevented || event.altKey) {
          return;
        }

        if ((event.key === 'k' || event.key === 'K') && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          if (container.hidden) {
            openCatalogSearch();
          } else {
            closeCatalogSearch();
          }
          return;
        }

        const activeElement = document.activeElement;
        if (
          activeElement &&
          (activeElement === input ||
            activeElement.tagName === 'INPUT' ||
            activeElement.tagName === 'TEXTAREA' ||
            activeElement.isContentEditable)
        ) {
          return;
        }

        if (event.key === '/') {
          event.preventDefault();
          openCatalogSearch();
          return;
        }

        if (event.key === 'Escape') {
          closeCatalogSearch();
        }
      });

      try {
        records = await loadCatalogSearchIndex();
        isReady = true;
      } catch (error) {
        console.warn('Nao foi possivel carregar o indice da busca.', error);
      }
    }

    applyTheme(storedTheme());
    applyRevokedPreference(storedRevokedPreference());

    const logoObserver = new MutationObserver(() => {
      applyTheme(storedTheme());
    });
    logoObserver.observe(document.body, { childList: true, subtree: true });

    themeToggle.addEventListener('click', () => {
      const isOpen = !themeMenu.hidden;
      themeMenu.hidden = isOpen;
      themeToggle.setAttribute('aria-expanded', String(!isOpen));
    });

    themeOptions.forEach((option) => {
      option.addEventListener('click', () => {
        localStorage.setItem('wiki-standards-theme', option.dataset.themeChoice);
        applyTheme(option.dataset.themeChoice);
        closeThemeMenu();
      });
    });

    if (revokedToggle) {
      revokedToggle.addEventListener('click', () => {
        const nextHidden = document.body.dataset.hideRevoked !== 'true';
        localStorage.setItem('wiki-standards-hide-revoked', String(nextHidden));
        applyRevokedPreference(nextHidden);
      });
    }

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.appearance-switcher')) {
        closeThemeMenu();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeThemeMenu();
      }
    });

    systemTheme.addEventListener('change', () => {
      if (storedTheme() === 'auto') {
        applyTheme('auto');
      }
    });

    window.addEventListener('scroll', schedulePageTocActiveUpdate, { passive: true });
    window.addEventListener('resize', schedulePageTocActiveUpdate);

    window.$docsify.plugins = (window.$docsify.plugins || []).concat((hook) => {
      hook.doneEach(() => {
        window.requestAnimationFrame(() => {
          setupCpcQuickJump().catch((error) => {
            console.warn('Nao foi possivel montar o atalho de normas CPC.', error);
          });
          enhanceRevokedSections();
          applyRevokedPreference(storedRevokedPreference());
          renderPageToc();
        });
      });
    });

    setupCatalogSearch().catch((error) => {
      console.warn('Nao foi possivel ativar a busca do catalogo.', error);
    });
  </script>
